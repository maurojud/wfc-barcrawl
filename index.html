<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🎲 Zufalls-Picker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#121212;--card:#1c1c1c;--card2:#252525;--accent:#E30613;--accent2:#FFD000;--green:#00b894;--red:#e17055;--text:#f0f0f0;--text2:#aaa;--radius:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.app{max-width:500px;margin:0 auto;padding:12px;padding-bottom:80px}
h1{text-align:center;font-size:1.6rem;margin:12px 0;background:linear-gradient(135deg,#E30613,#FFD000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:16px}
.loading{text-align:center;padding:40px;color:var(--text2);font-size:1.1rem}

/* Event selection screen */
.event-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:20px}
.event-screen h1{font-size:2rem;margin-bottom:8px}
.event-list{width:100%;max-width:400px}
.event-btn{width:100%;padding:20px;margin-bottom:12px;border:2px solid #2a2a4a;border-radius:var(--radius);background:var(--card);color:var(--text);font-size:1.1rem;font-weight:700;cursor:pointer;transition:.2s;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
.event-btn:hover{border-color:var(--accent);background:var(--card2)}
.event-btn:active{transform:scale(.97)}
.event-name{flex:1}
.event-badge{background:#333;color:var(--text2);border-radius:20px;padding:2px 10px;font-size:.75rem;font-weight:400}

/* Event bar */
.event-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;padding:6px 14px;background:var(--card);border-radius:var(--radius);border:1px solid #333;font-size:.85rem;color:var(--text2)}
.event-bar strong{color:var(--accent2)}
.event-change{background:none;border:1px solid #444;color:var(--text2);padding:3px 10px;border-radius:10px;cursor:pointer;font-size:.75rem}

/* Group screen */
.group-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;padding:20px}
.group-list{width:100%;max-width:400px}
.group-btn{width:100%;padding:14px 18px;margin-bottom:12px;border:2px solid #2a2a4a;border-radius:var(--radius);background:var(--card);color:var(--text);font-size:1.1rem;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:14px;text-align:left}
.group-btn:hover{border-color:var(--accent);background:var(--card2)}
.group-btn:active{transform:scale(.97)}
.group-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #444;cursor:pointer;flex-shrink:0}
.group-avatar-placeholder{width:56px;height:56px;border-radius:50%;background:#333;border:3px dashed #555;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;flex-shrink:0}

/* Tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid #333;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;padding:10px 0 8px;text-align:center;cursor:pointer;transition:.2s;font-size:.75rem;color:var(--text2)}
.tab.active{color:var(--accent2)}
.tab-icon{font-size:1.4rem;display:block;margin-bottom:2px}
.tabs.hidden{display:none}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:12px;border:1px solid #333}

/* Big Buttons */
.big-btn{width:100%;padding:28px 20px;border:none;border-radius:var(--radius);font-size:1.2rem;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:12px}
.big-btn:active{transform:scale(.97)}
.big-btn:disabled{cursor:not-allowed}
.btn-ort{background:linear-gradient(135deg,#8B0000,#E30613);color:#fff;border:1px solid #E30613}
.btn-aufgabe{background:linear-gradient(135deg,#8B6914,#FFD000);color:#1a1a1a;border:1px solid #FFD000}
.btn-name{background:linear-gradient(135deg,#0a4a7a,#1a88d4);color:#fff;border:1px solid #1a88d4}

/* Results */
.result{background:var(--card2);border-radius:var(--radius);padding:24px;margin:12px 0;text-align:center;border:2px solid var(--accent);animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slotUp{0%{transform:translateY(100%);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(-100%);opacity:0}}
@keyframes slotLand{0%{transform:translateY(100%) scale(.8);opacity:0}50%{transform:translateY(-5%) scale(1.08);opacity:1}75%{transform:translateY(3%) scale(.98)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 15px rgba(76,175,80,0.3)}50%{box-shadow:0 0 30px rgba(76,175,80,0.6)}}
.slot-box{background:var(--card2);border-radius:var(--radius);padding:20px;margin:12px 0;border:2px solid var(--accent);text-align:center;overflow:hidden;position:relative}
.slot-box.spinning{border-color:var(--green);animation:glowPulse .5s ease infinite}
.slot-window{height:50px;overflow:hidden;position:relative;margin:8px 0}
.slot-item{position:absolute;width:100%;font-size:1.3rem;font-weight:700;line-height:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;box-sizing:border-box}
.slot-item.spin{animation:slotUp var(--speed) linear}
.slot-item.land{animation:slotLand .5s cubic-bezier(.17,.67,.29,1.35) forwards}
.slot-label{font-size:.8rem;color:var(--text2);text-transform:uppercase;letter-spacing:2px}
.result-label{font-size:.8rem;color:var(--text2);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.result-text{font-size:1.4rem;font-weight:700;margin-bottom:16px}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.result-btn{padding:10px 20px;border:none;border-radius:12px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.result-btn:active{transform:scale(.95)}
.btn-maps{background:#1a73e8;color:#fff}
.last-result{background:var(--card2);border-radius:var(--radius);padding:16px;margin:8px 0;text-align:center;border:1px solid #444}
.name-result{border-color:#1a88d4}

/* Lists */
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.list-header h2{font-size:1.1rem}
.badge{background:var(--accent);color:#fff;border-radius:20px;padding:2px 10px;font-size:.8rem}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--card2);border-radius:12px;margin-bottom:8px;border:1px solid #333;gap:8px}
.list-item-text{flex:1;word-break:break-word;font-size:.95rem}
.list-item-url{font-size:.75rem;color:var(--text2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.item-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:34px;height:34px;border:none;border-radius:10px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:active{transform:scale(.9)}
.icon-btn.edit{background:#2a4a8a;color:#64b5f6}
.icon-btn.del{background:#5a2a2a;color:#e17055}
.icon-btn.maps-small{background:#1a4a2a;color:#64f6a0}

/* Forms */
.form-row{display:flex;gap:8px;margin-bottom:12px}
input[type=text],input[type=password]{flex:1;padding:12px;border:1px solid #333;border-radius:12px;background:var(--card2);color:var(--text);font-size:.95rem;outline:none}
input:focus{border-color:var(--accent)}
.add-btn{padding:12px 20px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:.95rem;white-space:nowrap}
.add-btn:active{transform:scale(.95)}

/* Admin */
.admin-bar{display:flex;justify-content:center;margin:12px 0}
.admin-toggle{background:none;border:1px solid #444;color:var(--text2);padding:8px 16px;border-radius:12px;cursor:pointer;font-size:.8rem}
.admin-toggle.active{border-color:var(--accent);color:var(--accent)}
.master-badge{background:#6a0dad;color:#fff;border-radius:20px;padding:2px 10px;font-size:.75rem;margin-left:8px}

/* Group bar */
.group-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;padding:8px 16px;background:var(--card);border-radius:var(--radius);border:1px solid #333;font-size:.9rem;color:var(--text2)}
.group-bar strong{color:var(--text)}
.group-change{background:none;border:1px solid #444;color:var(--text2);padding:4px 12px;border-radius:10px;cursor:pointer;font-size:.75rem}

/* Empty */
.empty{text-align:center;color:var(--text2);padding:30px;font-size:.9rem}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:var(--radius);padding:24px;width:100%;max-width:400px;border:1px solid #444}
.modal h3{margin-bottom:16px}
.modal input{width:100%;margin-bottom:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal-btn{padding:10px 20px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:.9rem}
.modal-save{background:var(--accent);color:#fff}
.modal-cancel{background:#444;color:#fff}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 24px;border-radius:12px;font-weight:600;z-index:300;animation:toast 2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}

/* Error */
.error-banner{background:#5a2a2a;border:1px solid var(--red);border-radius:12px;padding:16px;margin:12px 0;text-align:center;color:var(--red);font-size:.9rem}

/* Modes */
.mode-section{margin-top:12px;padding:16px;background:var(--card2);border-radius:var(--radius);border:1px solid #333}
.mode-section h4{font-size:.9rem;margin-bottom:8px;color:var(--text)}
.mode-group{display:flex;gap:4px;margin-bottom:8px}
.mode-btn{flex:1;padding:8px 4px;border:1px solid #444;border-radius:10px;background:var(--card);color:var(--text2);font-size:.7rem;cursor:pointer;text-align:center;transition:.2s;font-weight:500}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.mode-btn.active-gold{background:var(--accent2);color:#1a1a1a;border-color:var(--accent2);font-weight:700}
.mode-reset-btn{width:100%;padding:8px;border:1px solid var(--red);border-radius:10px;background:#5a2a2a;color:var(--red);font-size:.8rem;cursor:pointer;margin-top:6px;font-weight:600}

/* Route overlay */
.route-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:250;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.route-panel{background:var(--card);border-radius:var(--radius);padding:24px;width:100%;max-width:440px;border:1px solid #444;margin:20px 0}
.route-stop{display:flex;align-items:flex-start;gap:12px;padding:12px;background:var(--card2);border-radius:12px;margin-bottom:8px;border:1px solid #333}
.route-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
.route-stop-info{flex:1}
.route-stop-name{font-weight:700;font-size:1rem}
.route-stop-task{font-size:.85rem;color:var(--accent2);margin-top:4px}
.route-stop-time{font-size:.75rem;color:var(--text2);margin-top:2px}
.route-line{width:2px;height:16px;background:#444;margin:0 0 0 27px}
.route-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* Avatar picker */
.avatar-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:250;display:flex;align-items:center;justify-content:center;padding:16px}
.avatar-picker{background:var(--card);border-radius:var(--radius);padding:24px;width:100%;max-width:360px;border:1px solid #444;text-align:center}
.avatar-picker h3{margin-bottom:16px;color:var(--text)}
.avatar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.avatar-option{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #444;cursor:pointer;transition:.2s;margin:0 auto}
.avatar-option:hover,.avatar-option.selected{border-color:var(--accent2);box-shadow:0 0 12px rgba(255,208,0,0.5)}
</style>
</head>

// ===== UTILS =====
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2100);}
const app=document.getElementById('app');
const tabBar=document.getElementById('tab-bar');

// ===== SUPABASE HELPERS =====
async function loadEvents(){
  const {data,error}=await sb.from('events').select('*').order('id');
  if(error)throw error;
  events=data||[];
}
async function loadGroups(){
  if(!currentEvent)return;
  const {data,error}=await sb.from('groups').select('*').eq('event_id',currentEvent.id).order('id');
  if(error)throw error;
  groups=data||[];
}
async function loadLocations(){
  if(!currentEvent)return;
  const {data,error}=await sb.from('locations').select('*').eq('event_id',currentEvent.id).order('id');
  if(!error)locations=(data||[]).map(l=>({id:l.id,name:l.name,url:l.maps_url||''}));
}
async function loadTasks(){
  if(!currentEvent)return;
  const {data,error}=await sb.from('tasks').select('*').eq('event_id',currentEvent.id).order('id');
  if(!error)tasks=(data||[]).map(t=>({id:t.id,text:t.text}));
}
async function loadNames(){
  if(!currentEvent)return;
  const {data,error}=await sb.from('names').select('*').eq('event_id',currentEvent.id).order('id');
  if(!error)namesList=(data||[]).map(n=>({id:n.id,name:n.name,group_id:n.group_id||null}));
}
async function loadSettings(){
  if(!currentEvent)return;
  try{
    const {data}=await sb.from('settings').select('*').eq('event_id',currentEvent.id);
    if(data)data.forEach(s=>{
      if(s.key==='location_mode')locationMode=s.value;
      if(s.key==='task_mode')taskMode=s.value;
      if(s.key==='rolled_name')rolledName=s.value||null;
    });
  }catch(e){console.error(e);}
}
async function saveSetting(key,value){
  if(!currentEvent)return;
  const {data:ex}=await sb.from('settings').select('id').eq('event_id',currentEvent.id).eq('key',key).maybeSingle();
  if(ex){await sb.from('settings').update({value}).eq('id',ex.id);}
  else{await sb.from('settings').insert({event_id:currentEvent.id,key,value});}
}
async function loadUsedItems(){
  if(!currentEvent)return;
  const {data}=await sb.from('used_items').select('*').eq('event_id',currentEvent.id).order('used_at');
  usedItems=data||[];
}
async function addUsedItem(groupId,itemType,itemId,itemName,itemExtra){
  const r={event_id:currentEvent.id,group_id:groupId,item_type:itemType,item_id:itemId,item_name:itemName,item_extra:itemExtra||null};
  const {data,error}=await sb.from('used_items').insert(r).select().single();
  if(!error&&data)usedItems.push(data);
}
async function deleteUsedItem(id){
  const {error}=await sb.from('used_items').delete().eq('id',id);
  if(!error)usedItems=usedItems.filter(u=>u.id!==id);
}
async function loadGroupTimers(){
  if(!currentGroup)return;
  try{
    const {data}=await sb.from('group_timers').select('*').eq('group_id',currentGroup.id);
    const now=Date.now();
    (data||[]).forEach(t=>{
      const end=new Date(t.cooldown_end).getTime();
      if(t.timer_type==='location'){locCooldownEnd=end;if(t.last_result_name)lastLocResult={name:t.last_result_name,extra:t.last_result_extra||''};}
      else if(t.timer_type==='task'){taskCooldownEnd=end;if(t.last_result_name)lastTaskResult={name:t.last_result_name};}
    });
  }catch(e){console.error(e);}
}
async function saveTimer(type,cooldownEnd,resultName,resultExtra){
  if(!currentGroup)return;
  const {data:ex}=await sb.from('group_timers').select('id').eq('group_id',currentGroup.id).eq('timer_type',type).maybeSingle();
  const r={group_id:currentGroup.id,timer_type:type,cooldown_end:new Date(cooldownEnd).toISOString(),last_result_name:resultName||null,last_result_extra:resultExtra||null};
  if(ex){await sb.from('group_timers').update(r).eq('id',ex.id);}
  else{await sb.from('group_timers').insert(r);}
}
function getAvailableLocations(){
  if(locationMode==='free')return locations;
  const used=usedItems.filter(u=>u.item_type==='location'&&(locationMode==='all_groups'||u.group_id===(currentGroup?currentGroup.id:-1))).map(u=>u.item_id);
  return locations.filter(l=>!used.includes(l.id));
}
function getAvailableTasks(){
  if(taskMode==='free')return tasks;
  const used=usedItems.filter(u=>u.item_type==='task'&&(taskMode==='all_groups'||u.group_id===(currentGroup?currentGroup.id:-1))).map(u=>u.item_id);
  return tasks.filter(t=>!used.includes(t.id));
}
function getGroupRoute(groupId){return usedItems.filter(u=>u.item_type==='location'&&u.group_id===groupId).sort((a,b)=>new Date(a.used_at)-new Date(b.used_at));}
function buildRouteUrl(stops){
  if(!stops.length)return null;
  const label=s=>s.item_extra&&s.item_extra.startsWith('http')?s.item_name:s.item_name;
  if(stops.length===1)return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(label(stops[0]))+'&travelmode=walking';
  const dest=label(stops[stops.length-1]);
  const wp=stops.slice(0,-1).map(s=>label(s)).join('|');
  return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'&waypoints='+encodeURIComponent(wp)+'&travelmode=walking';
}

// ===== SLOT ANIMATION =====
function slotAnimate(targetEl,items,emoji,label,finalIdx,onDone){
  isSpinning=true;
  const total=15+Math.floor(Math.random()*6);let step=0;const base=60;
  targetEl.innerHTML=`<div class="slot-box spinning"><div class="slot-label">${emoji} ${label}</div><div class="slot-window"><div class="slot-item spin" style="--speed:${base}ms">${esc(items[0])}</div></div></div>`;
  function next(){
    step++;
    if(step>=total){
      const box=targetEl.querySelector('.slot-box');if(box)box.classList.remove('spinning');
      const win=targetEl.querySelector('.slot-window');if(win)win.innerHTML=`<div class="slot-item land">${esc(items[finalIdx])}</div>`;
      isSpinning=false;setTimeout(onDone,500);return;
    }
    const prog=step/total;const spd=base+Math.floor(prog*prog*300);
    const i=step<total-1?Math.floor(Math.random()*items.length):finalIdx;
    const win=targetEl.querySelector('.slot-window');if(win)win.innerHTML=`<div class="slot-item spin" style="--speed:${spd}ms">${esc(items[i])}</div>`;
    setTimeout(next,spd);
  }
  setTimeout(next,base);
}

async function pickLocation(){
  if(!locations.length){showToast('Keine Orte vorhanden!');return;}
  const avail=getAvailableLocations();if(!avail.length){showToast('Alle Orte besucht! ✅');return;}
  const idx=Math.floor(Math.random()*avail.length);const loc=avail[idx];
  locCooldownEnd=Date.now()+COOLDOWN_MS;lastLocResult={name:loc.name,extra:loc.url};
  saveTimer('location',locCooldownEnd,loc.name,loc.url);
  if(locationMode!=='free'&&currentGroup)addUsedItem(currentGroup.id,'location',loc.id,loc.name,loc.url);
  startTimerUpdates();
  const locBtn=document.getElementById('loc-btn');if(locBtn){locBtn.disabled=true;locBtn.style.opacity='.4';}
  const el=document.getElementById('loc-result');
  slotAnimate(el,avail.map(l=>l.name),'📍','Nächster Halt',idx,()=>{
    el.innerHTML=`<div class="result"><div class="result-label">📍 Nächster Halt</div><div class="result-text">${esc(loc.name)}</div><div class="result-actions"><button class="result-btn btn-maps" onclick="openRoute('${(loc.url||loc.name).replace(/'/g,"\\'")}')">🗺️ Route von hier</button></div></div>`;
  });
}
async function pickTask(){
  if(!tasks.length){showToast('Keine Aufgaben vorhanden!');return;}
  const avail=getAvailableTasks();if(!avail.length){showToast('Alle Aufgaben erledigt! ✅');return;}
  const idx=Math.floor(Math.random()*avail.length);const task=avail[idx];
  taskCooldownEnd=Date.now()+COOLDOWN_MS;lastTaskResult={name:task.text};
  saveTimer('task',taskCooldownEnd,task.text,'');
  if(taskMode!=='free'&&currentGroup)addUsedItem(currentGroup.id,'task',task.id,task.text,'');
  startTimerUpdates();
  const taskBtn=document.getElementById('task-btn');if(taskBtn){taskBtn.disabled=true;taskBtn.style.opacity='.4';}
  const el=document.getElementById('task-result');
  slotAnimate(el,avail.map(t=>t.text),'📋','Deine Aufgabe',idx,()=>{
    el.innerHTML=`<div class="result"><div class="result-label">📋 Deine Aufgabe</div><div class="result-text">${esc(task.text)}</div></div>`;
  });
}
async function pickName(){
  // Filter names for current group (group_id matches or null = all groups)
  const available=namesList.filter(n=>!n.group_id||(currentGroup&&n.group_id===currentGroup.id));
  if(!available.length){showToast('Keine Namen für diese Gruppe! Admin muss Namen zuweisen.');return;}
  const idx=Math.floor(Math.random()*available.length);const names=available.map(n=>n.name);
  const el=document.getElementById('name-result');if(!el)return;
  slotAnimate(el,names,'👤','Gerollter Name',idx,async()=>{
    rolledName=names[idx];await saveSetting('rolled_name',rolledName);
    el.innerHTML=`<div class="last-result name-result"><div class="result-label">👤 Gerollter Name</div><div class="result-text">${esc(rolledName)}</div><div class="result-actions" style="margin-top:10px"><button class="result-btn" onclick="clearRolledName()" style="background:#5a2a2a;color:#e17055">❌ Namen löschen</button></div></div>`;
  });
}
async function clearRolledName(){
  rolledName=null;await saveSetting('rolled_name','');
  const el=document.getElementById('name-result');if(el)el.innerHTML='';
  showToast('Name gelöscht!');
}
function openRoute(dest){
  if(dest.startsWith('http'))window.open(dest,'_blank');
  else window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'&travelmode=walking','_blank');
}
function shareWhatsApp(){
  if(!currentGroup)return;
  let msg=`🎲 *${currentGroup.name} – ${currentEvent.name}*\n\n`;
  if(lastLocResult){const u=lastLocResult.extra||'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lastLocResult.name)+'&travelmode=walking';msg+=`📍 *Halt:* ${lastLocResult.name}\n🗺️ ${u}\n\n`;}
  if(lastTaskResult)msg+=`📋 *Aufgabe:* ${lastTaskResult.name}\n`;
  if(rolledName)msg+=`👤 *Name:* ${rolledName}\n`;
  msg+=`\n🍻 Prost! 🍺`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
async function resetTimer(type){
  if(!currentGroup)return;
  const past=new Date(0).toISOString();
  const {data}=await sb.from('group_timers').select('id,timer_type').eq('group_id',currentGroup.id);
  for(const row of (data||[])){
    if(row.timer_type===type)await sb.from('group_timers').update({cooldown_end:past,last_result_name:null,last_result_extra:null}).eq('id',row.id);
  }
  if(type==='location'){locCooldownEnd=0;lastLocResult=null;}
  if(type==='task'){taskCooldownEnd=0;lastTaskResult=null;}
  render();showToast('Timer zurückgesetzt ⏱️');
}
async function setMode(key,value){
  if(key==='location_mode')locationMode=value;
  if(key==='task_mode')taskMode=value;
  await saveSetting(key,value);render();showToast('Modus geändert ⚙️');
}
async function resetUsedItems(){
  if(!confirm('Alle besuchten Orte zurücksetzen?'))return;
  if(!currentEvent)return;
  await sb.from('used_items').delete().eq('event_id',currentEvent.id);
  usedItems=[];render();showToast('Zurückgesetzt! 🔄');
}

// ===== ROUTE OVERLAY =====
function showRouteOverlay(){
  const stops=getGroupRoute(currentGroup.id);if(!stops.length){showToast('Noch keine Stops!');return;}
  const tasks2=usedItems.filter(u=>u.item_type==='task'&&u.group_id===currentGroup.id).sort((a,b)=>new Date(a.used_at)-new Date(b.used_at));
  let html=`<div class="route-overlay" onclick="if(event.target===this)closeRoute()"><div class="route-panel"><h3>🗺️ Route: ${esc(currentGroup.name)}</h3>`;
  stops.forEach((stop,i)=>{
    const time=new Date(stop.used_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    const mt=tasks2[i];
    html+=`<div class="route-stop"><div class="route-num">${i+1}</div><div class="route-stop-info"><div class="route-stop-name">${esc(stop.item_name)}</div>${mt?`<div class="route-stop-task">📋 ${esc(mt.item_name)}</div>`:''}<div class="route-stop-time">🕒 ${time}</div></div>${isAdmin?`<button class="icon-btn del" onclick="deleteRouteStop(${stop.id}${mt?','+mt.id:',null'})" style="align-self:center">🗑️</button>`:''}</div>`;
    if(i<stops.length-1)html+=`<div class="route-line"></div>`;
  });
  html+=`<div class="route-actions">`;
  const url=buildRouteUrl(stops);if(url)html+=`<button class="result-btn btn-maps" onclick="window.open('${url}','_blank')">🗺️ In Google Maps</button>`;
  html+=`<button class="result-btn" onclick="closeRoute()" style="background:#444;color:#fff">Schliessen</button></div>`;
  if(isAdmin)html+=`<div style="margin-top:12px;text-align:center"><button class="mode-reset-btn" onclick="clearGroupRoute()">🗑️ Route löschen</button></div>`;
  html+=`</div></div>`;
  const div=document.createElement('div');div.id='route-overlay';div.innerHTML=html;document.body.appendChild(div);
}
function closeRoute(){const el=document.getElementById('route-overlay');if(el)el.remove();}
async function deleteRouteStop(locId,taskId){
  if(locId)await deleteUsedItem(locId);if(taskId&&taskId!=='null')await deleteUsedItem(parseInt(taskId));
  closeRoute();showRouteOverlay();showToast('Stop entfernt!');
}
async function clearGroupRoute(){
  if(!confirm('Route dieser Gruppe löschen?'))return;
  const ids=usedItems.filter(u=>u.group_id===currentGroup.id).map(u=>u.id);
  for(const id of ids)await deleteUsedItem(id);
  closeRoute();render();showToast('Route gelöscht!');
}

// ===== ORTE TAB =====
function renderOrte(){
  let html=`<h1>📍 Orte</h1>`;
  if(isAdmin)html+=`<div class="card"><div class="form-row"><input type="text" id="loc-name" placeholder="Name des Orts"></div><div class="form-row"><input type="text" id="loc-url" placeholder="Google Maps Link (optional)"><button class="add-btn" onclick="addLocation()">+ Hinzufügen</button></div></div>`;
  html+=`<div class="list-header"><h2>Alle Orte</h2><span class="badge">${locations.length}</span></div>`;
  if(!locations.length)html+=`<div class="empty">Noch keine Orte</div>`;
  else locations.forEach(loc=>html+=`<div class="list-item"><div class="list-item-text">${esc(loc.name)}${loc.url?`<span class="list-item-url">${esc(loc.url)}</span>`:''}</div><div class="item-actions">${loc.url?`<button class="icon-btn maps-small" onclick="window.open('${esc(loc.url)}','_blank')">🗺️</button>`:''}${isAdmin?`<button class="icon-btn edit" onclick="editLocation(${loc.id})">✏️</button><button class="icon-btn del" onclick="deleteLocation(${loc.id})">🗑️</button>`:''}</div></div>`);
  app.innerHTML=html;
}
async function addLocation(){
  const name=document.getElementById('loc-name').value.trim();const url=document.getElementById('loc-url').value.trim();
  if(!name){showToast('Bitte Namen eingeben!');return;}
  const {data,error}=await sb.from('locations').insert({name,maps_url:url,event_id:currentEvent.id}).select().single();
  if(error){showToast('Fehler: '+error.message);return;}
  locations.push({id:data.id,name:data.name,url:data.maps_url||''});render();showToast('Ort hinzugefügt! 📍');
}
function editLocation(id){
  const loc=locations.find(l=>l.id===id);if(!loc)return;
  showModal('Ort bearbeiten',[{key:'name',label:'Name',value:loc.name},{key:'url',label:'Google Maps Link',value:loc.url}],async(vals)=>{
    await sb.from('locations').update({name:vals.name,maps_url:vals.url}).eq('id',id);
    loc.name=vals.name;loc.url=vals.url;render();showToast('Ort aktualisiert! ✏️');
  });
}
async function deleteLocation(id){
  if(!confirm('Ort löschen?'))return;
  await sb.from('locations').delete().eq('id',id);
  locations=locations.filter(l=>l.id!==id);render();showToast('Ort gelöscht! 🗑️');
}

// ===== AUFGABEN TAB =====
function renderAufgaben(){
  let html=`<h1>📋 Aufgaben</h1>`;
  if(isAdmin)html+=`<div class="card"><div class="form-row"><input type="text" id="task-text" placeholder="Neue Aufgabe"><button class="add-btn" onclick="addTask()">+ Hinzufügen</button></div></div>`;
  html+=`<div class="list-header"><h2>Alle Aufgaben</h2><span class="badge">${tasks.length}</span></div>`;
  if(!tasks.length)html+=`<div class="empty">Noch keine Aufgaben</div>`;
  else tasks.forEach(t=>html+=`<div class="list-item"><div class="list-item-text">${esc(t.text)}</div><div class="item-actions">${isAdmin?`<button class="icon-btn edit" onclick="editTask(${t.id})">✏️</button><button class="icon-btn del" onclick="deleteTask(${t.id})">🗑️</button>`:''}</div></div>`);
  app.innerHTML=html;
}
async function addTask(){
  const text=document.getElementById('task-text').value.trim();if(!text){showToast('Bitte Aufgabe eingeben!');return;}
  const {data,error}=await sb.from('tasks').insert({text,event_id:currentEvent.id}).select().single();
  if(error){showToast('Fehler: '+error.message);return;}
  tasks.push({id:data.id,text:data.text});render();showToast('Aufgabe hinzugefügt! 📋');
}
function editTask(id){
  const task=tasks.find(t=>t.id===id);if(!task)return;
  showModal('Aufgabe bearbeiten',[{key:'text',label:'Aufgabe',value:task.text}],async(vals)=>{
    await sb.from('tasks').update({text:vals.text}).eq('id',id);
    task.text=vals.text;render();showToast('Aufgabe aktualisiert!');
  });
}
async function deleteTask(id){
  if(!confirm('Aufgabe löschen?'))return;
  await sb.from('tasks').delete().eq('id',id);
  tasks=tasks.filter(t=>t.id!==id);render();showToast('Aufgabe gelöscht!');
}

// ===== NAMEN TAB =====
function renderNamen(){
  const groupOptions=groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
  let html=`<h1>👤 Namen</h1>
    <div class="card">
      <div class="form-row"><input type="text" id="namen-input" placeholder="Neuer Name" onkeydown="if(event.key==='Enter')addName()"></div>
      <div class="form-row">
        <select id="namen-group" style="flex:1;padding:12px;border:1px solid #333;border-radius:12px;background:var(--card2);color:var(--text);font-size:.95rem">
          <option value="">Alle Gruppen (kein Filter)</option>${groupOptions}
        </select>
        <button class="add-btn" onclick="addName()">+ Hinzufügen</button>
      </div>
    </div>
    <div class="list-header"><h2>Alle Namen</h2><span class="badge">${namesList.length}</span></div>`;
  if(!namesList.length)html+=`<div class="empty">Noch keine Namen</div>`;
  else {
    // Group names by their group assignment
    const ungrouped=namesList.filter(n=>!n.group_id);
    const grouped=groups.map(g=>({group:g,names:namesList.filter(n=>n.group_id===g.id)})).filter(x=>x.names.length);
    if(ungrouped.length){
      html+=`<div style="font-size:.8rem;color:var(--text2);margin:8px 0 4px;text-transform:uppercase;letter-spacing:1px">Alle Gruppen</div>`;
      ungrouped.forEach(n=>html+=nameRow(n));
    }
    grouped.forEach(({group,names})=>{
      html+=`<div style="font-size:.8rem;color:var(--accent2);margin:8px 0 4px;text-transform:uppercase;letter-spacing:1px">${esc(group.name)}</div>`;
      names.forEach(n=>html+=nameRow(n));
    });
  }
  app.innerHTML=html;
}
function nameRow(n){
  const gName=n.group_id?(groups.find(g=>g.id===n.group_id)||{name:'?'}).name:'';
  const groupOptions=groups.map(g=>`<option value="${g.id}"${n.group_id===g.id?' selected':''}>${esc(g.name)}</option>`).join('');
  return `<div class="list-item">
    <div class="list-item-text">${esc(n.name)}</div>
    <div class="item-actions" style="gap:4px">
      <select onchange="assignNameGroup(${n.id},this.value)" style="padding:4px 6px;border:1px solid #444;border-radius:8px;background:var(--card2);color:var(--text);font-size:.75rem;cursor:pointer">
        <option value="">Alle</option>${groupOptions}
      </select>
      <button class="icon-btn del" onclick="removeName(${n.id})">🗑️</button>
    </div>
  </div>`;
}
async function assignNameGroup(nameId, groupId){
  const gid=groupId?parseInt(groupId):null;
  await sb.from('names').update({group_id:gid}).eq('id',nameId);
  const n=namesList.find(x=>x.id===nameId);if(n)n.group_id=gid;
  renderNamen();showToast('Gruppe zugewiesen!');
}
async function addName(){
  const input=document.getElementById('namen-input');const name=input?input.value.trim():'';
  if(!name){showToast('Bitte Namen eingeben!');return;}
  const groupSel=document.getElementById('namen-group');
  const group_id=groupSel&&groupSel.value?parseInt(groupSel.value):null;
  const {data,error}=await sb.from('names').insert({name,event_id:currentEvent.id,group_id}).select().single();
  if(error){showToast('Fehler: '+error.message);return;}
  namesList.push({id:data.id,name:data.name,group_id:data.group_id||null});render();showToast('Name hinzugefügt! 👤');
}
async function removeName(id){
  await sb.from('names').delete().eq('id',id);
  namesList=namesList.filter(n=>n.id!==id);render();showToast('Name gelöscht!');
}

// ===== MODAL =====
function showModal(title,fields,onSave){
  let html=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>${title}</h3>`;
  fields.forEach(f=>html+=`<input type="text" id="modal-${f.key}" value="${esc(f.value||'')}" placeholder="${f.label}">`);
  html+=`<div class="modal-actions"><button class="modal-btn modal-cancel" onclick="closeModal()">Abbrechen</button><button class="modal-btn modal-save" id="modal-save-btn">Speichern</button></div></div></div>`;
  const div=document.createElement('div');div.id='modal-container';div.innerHTML=html;document.body.appendChild(div);
  document.getElementById('modal-save-btn').onclick=()=>{
    const vals={};fields.forEach(f=>vals[f.key]=document.getElementById('modal-'+f.key).value.trim());
    closeModal();onSave(vals);
  };
}
function closeModal(){const m=document.getElementById('modal-container');if(m)m.remove();}

// ===== INIT =====
async function init(){
  try{
    app.innerHTML=`<div class="loading">🎲 Lade Daten...</div>`;
    await loadEvents();
    // Check session
    const savedEventId=sessionStorage.getItem('eventId');
    if(savedEventId){
      const ev=events.find(e=>e.id===parseInt(savedEventId));
      if(ev){
        currentEvent=ev;
        await Promise.all([loadGroups(),loadLocations(),loadTasks(),loadNames(),loadSettings(),loadUsedItems()]);
        const savedGroupId=sessionStorage.getItem('groupId');
        if(savedGroupId){
          const g=groups.find(x=>x.id===parseInt(savedGroupId));
          if(g){currentGroup=g;await loadGroupTimers();startSync();}
        }
      }
    }
    render();
  }catch(e){
    console.error(e);
    app.innerHTML=`<div class="app"><div class="error-banner">⚠️ Verbindungsfehler.<br><small>${esc(e.message||'')}</small><br><br><button class="add-btn" onclick="init()">🔄 Erneut versuchen</button></div></div>`;
  }
}
init();
</script>
</body>
</html>
